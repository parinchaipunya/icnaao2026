<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="3; url=https://icnaao2026.github.io/">
  <link rel="canonical" href="https://icnaao2026.github.io/">
  <title>Redirecting to ICNAAO 2026</title>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const countdown = document.getElementById("countdown");
      let secondsRemaining = 3;

      const timer = window.setInterval(() => {
        secondsRemaining -= 1;
        countdown.textContent = secondsRemaining;

        if (secondsRemaining === 0) {
          window.clearInterval(timer);
          window.location.replace("https://icnaao2026.github.io/");
        }
      }, 1000);
    });
  </script>
</head>
<body>
  <p>
    Redirecting to <a href="https://icnaao2026.github.io/">icnaao2026.github.io</a>
    in <span id="countdown">3</span> seconds&hellip;
  </p>
</body>
</html>
